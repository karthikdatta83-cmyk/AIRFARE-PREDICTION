<!DOCTYPE html>
<html>
<head>
    <title>Airfare Price Prediction</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Airfare Price Prediction</h1>
        <p>Predict your flight ticket price using Machine Learning</p>

        <form id="flightForm">

            <label>Airline</label>
            <input type="text" id="Airline" value="IndiGo" required>

            <label>Source</label>
            <input type="text" id="Source" value="Delhi" required>

            <label>Destination</label>
            <input type="text" id="Destination" value="Mumbai" required>

            <label>Route</label>
            <input type="text" id="Route" value="DEL → BOM" required>

            <label>Additional Information</label>
            <input type="text" id="Additional_Info" value="No info" required>

            <label>Duration (Minutes)</label>
            <input type="number" id="Duration" value="135" required>

            <label>Total Stops</label>
            <input type="number" id="Total_Stops" value="1" required>

            <label>Journey Day</label>
            <input type="number" id="Journey_Day" value="20" min="1" max="31" required>

            <label>Journey Month</label>
            <input type="number" id="Journey_Month" value="12" min="1" max="12" required>

            <label>Departure Hour</label>
            <input type="number" id="Dep_Hour" value="8" min="0" max="23" required>

            <label>Departure Minute</label>
            <input type="number" id="Dep_Minute" value="10" min="0" max="59" required>

            <label>Arrival Hour</label>
            <input type="number" id="Arrival_Hour" value="10" min="0" max="23" required>

            <label>Arrival Minute</label>
            <input type="number" id="Arrival_Minute" value="15" min="0" max="59" required>

            <button type="submit">Predict Fare</button>

        </form>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
