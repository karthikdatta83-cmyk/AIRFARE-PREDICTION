<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Airfare Price Prediction</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Airfare Price Prediction</h1>

        <p>Predict your flight ticket price using Machine Learning</p>

        <form id="flightForm">

            <label for="Airline">Airline</label>
            <select id="Airline" required>
                <option value="">Loading airlines...</option>
            </select>


            <label for="Source">Source</label>
            <select id="Source" required>
                <option value="">Loading sources...</option>
            </select>


            <label for="Destination">Destination</label>
            <select id="Destination" required>
                <option value="">Select Destination</option>
            </select>


            <label for="Route">Route</label>
            <select id="Route" required>
                <option value="">Select Route</option>
            </select>


            <label for="Additional_Info">Additional Information</label>
            <select id="Additional_Info" required>
                <option value="">Loading information...</option>
            </select>


            <label for="Duration">Duration (Minutes)</label>
            <input
                type="number"
                id="Duration"
                value="135"
                min="5"
                max="2860"
                required
            >


            <label for="Total_Stops">Total Stops</label>
            <select id="Total_Stops" required>
                <option value="">Select Route First</option>
            </select>


            <label for="Journey_Day">Journey Day</label>
            <input
                type="number"
                id="Journey_Day"
                value="20"
                min="1"
                max="31"
                required
            >


            <label for="Journey_Month">Journey Month</label>
            <input
                type="number"
                id="Journey_Month"
                value="12"
                min="1"
                max="12"
                required
            >


            <label for="Dep_Hour">Departure Hour</label>
            <input
                type="number"
                id="Dep_Hour"
                value="8"
                min="0"
                max="23"
                required
            >


            <label for="Dep_Minute">Departure Minute</label>
            <input
                type="number"
                id="Dep_Minute"
                value="10"
                min="0"
                max="59"
                required
            >


            <label for="Arrival_Hour">Arrival Hour</label>
            <input
                type="number"
                id="Arrival_Hour"
                value="10"
                min="0"
                max="23"
                required
            >


            <label for="Arrival_Minute">Arrival Minute</label>
            <input
                type="number"
                id="Arrival_Minute"
                value="15"
                min="0"
                max="59"
                required
            >


            <button type="submit" id="predictButton">
                Predict Fare
            </button>

        </form>


        <div id="result"></div>

    </div>


    <script src="script.js"></script>

</body>

</html>
