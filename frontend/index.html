<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkyFare - Airfare Price Prediction</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>✈️ SkyFare Airfare Prediction</h1>

        <p>Predict your flight ticket price using Machine Learning</p>

        <form id="flightForm">

            <h2>Flight Details</h2>

            <!-- Airline -->
            <label for="Airline">Airline</label>
            <select id="Airline" required>
                <option value="">Loading Airlines...</option>
            </select>

            <!-- Source -->
            <label for="Source">Source</label>
            <select id="Source" required>
                <option value="">Loading Sources...</option>
            </select>

            <!-- Destination -->
            <label for="Destination">Destination</label>
            <select id="Destination" required>
                <option value="">Select Source First</option>
            </select>

            <!-- Route -->
            <label for="Route">Route</label>
            <select id="Route" required>
                <option value="">Select Destination First</option>
            </select>

            <!-- Additional Information -->
            <label for="Additional_Info">Additional Information</label>
            <select id="Additional_Info" required>
                <option value="">Loading Options...</option>
            </select>

            <!-- Duration -->
            <label for="Duration">Flight Duration (Minutes)</label>
            <input
                type="number"
                id="Duration"
                min="5"
                max="2860"
                placeholder="Example: 170"
                required
            >

            <!-- Stops -->
            <label for="Total_Stops">Total Stops</label>
            <select id="Total_Stops" required>
                <option value="">Select Route First</option>
            </select>

            <h2>Journey Date</h2>

            <!-- Journey Day -->
            <label for="Journey_Day">Journey Day</label>
            <input
                type="number"
                id="Journey_Day"
                min="1"
                max="31"
                placeholder="Example: 25"
                required
            >

            <!-- Journey Month -->
            <label for="Journey_Month">Journey Month</label>
            <select id="Journey_Month" required>
                <option value="">Select Month</option>
                <option value="1">January</option>
                <option value="2">February</option>
                <option value="3">March</option>
                <option value="4">April</option>
                <option value="5">May</option>
                <option value="6">June</option>
                <option value="7">July</option>
                <option value="8">August</option>
                <option value="9">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>
            </select>

            <h2>Departure Time</h2>

            <!-- Departure Hour -->
            <label for="Dep_Hour">Departure Hour</label>
            <input
                type="number"
                id="Dep_Hour"
                min="0"
                max="23"
                placeholder="0 - 23"
                required
            >

            <!-- Departure Minute -->
            <label for="Dep_Minute">Departure Minute</label>
            <input
                type="number"
                id="Dep_Minute"
                min="0"
                max="59"
                placeholder="0 - 59"
                required
            >

            <h2>Arrival Time</h2>

            <!-- Arrival Hour -->
            <label for="Arrival_Hour">Arrival Hour</label>
            <input
                type="number"
                id="Arrival_Hour"
                min="0"
                max="23"
                placeholder="0 - 23"
                required
            >

            <!-- Arrival Minute -->
            <label for="Arrival_Minute">Arrival Minute</label>
            <input
                type="number"
                id="Arrival_Minute"
                min="0"
                max="59"
                placeholder="0 - 59"
                required
            >

            <!-- Prediction Button -->
            <button type="submit" id="predictButton">
                Predict Airfare
            </button>

        </form>

        <!-- Prediction Result -->
        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
